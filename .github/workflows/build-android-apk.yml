name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-fd
    paths:
      - 'android/**'
      - 'app/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -x ./gradlew || -f ./gradlew ]]; then
            echo 'dir=.' >> "$GITHUB_OUTPUT"
          elif [[ -x ./android/gradlew || -f ./android/gradlew ]]; then
            echo 'dir=android' >> "$GITHUB_OUTPUT"
          else
            echo 'No Gradle wrapper found at ./gradlew or ./android/gradlew.' >&2
            echo 'Commit the Android application project before running this workflow.' >&2
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find '${{ steps.project.outputs.dir }}' -type f -path '*/build/outputs/apk/debug/*.apk' | sort)

          if (( ${#apks[@]} == 0 )); then
            echo 'Gradle completed, but no debug APK was found.' >&2
            exit 1
          fi

          mkdir -p apk-output
          cp "${apks[@]}" apk-output/
          printf 'Collected APK files:\n'
          ls -lh apk-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-android-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
